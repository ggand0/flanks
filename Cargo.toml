[package]
name = "frontline"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19"
bytemuck = { version = "1", features = ["derive"] }

# Bevy-recommended dev profile: fast recompiles for our code, optimized deps.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Faster runtime than dev, faster builds than release.
[profile.opt-dev]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
