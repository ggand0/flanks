[package]
name = "flanks"
version = "0.1.0"
edition = "2024"
description = "Real-time massed medieval battles in Rust and Bevy, every soldier simulated"
license = "MIT OR Apache-2.0"

[dependencies]
# mp3: the generated battle audio is mp3 (bevy default is vorbis-only);
# wav: two of the volley-sheet takes came out of the generator as wav.
bevy = { version = "0.19", features = ["mp3", "wav"] }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
dirs = "6.0.0"
# Reading unit models (src/unit_glb.rs). Same crate and feature set bevy's
# own glTF loader already pulls in, so this costs no extra build.
gltf = { version = "1.4", default-features = false, features = ["names", "utils"] }
serde = { version = "1.0.229", features = ["derive"] }
# Attack motion tables that ship next to a unit model (src/unit_glb.rs).
serde_json = "1.0.150"
serde_yaml_ng = "0.10.0"
# Timestamp queries around the sun's shadow pass (src/render_units_shadow.rs):
# bevy does not re-export wgpu's query set types. The same wgpu bevy 0.19
# builds on, no features of its own, so this costs no extra build.
wgpu = { version = "29", default-features = false }
# The game window's icon (src/window_icon.rs): bevy does not re-export
# winit's icon type. The same winit bevy 0.19 builds on, no features of its
# own, so this costs no extra build.
winit = { version = "0.30", default-features = false }

[build-dependencies]
# Embeds the icon in the Windows executable (build.rs), with MSVC and with
# mingw, native or cross.
embed-resource = "3"

[features]
# Profiling: `cargo run --profile opt-dev --features tracy`, then attach
# the Tracy UI. Enables bevy's per-system spans + our manual sim spans.
tracy = ["bevy/trace_tracy"]

# Bevy-recommended dev profile: fast recompiles for our code, optimized deps.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Faster runtime than dev, faster builds than release.
[profile.opt-dev]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16

# Packaging with cargo-appimage and cargo-bundle. Both carry the assets
# folder, which the game looks for at run time (`util::game_root`); an
# AppImage keeps it at its root, a macOS app bundle in Contents/Resources.
# appimagetool will not build an AppImage without an icon.
[package.metadata.appimage]
icon = "assets/flanks_icon_256.png"
assets = ["assets"]

[package.metadata.bundle]
name = "FLANKS"
identifier = "com.ggando.flanks"
icon = ["assets/flanks_icon.icns"]
short_description = "Real-time massed medieval battles, every soldier simulated"
resources = ["assets"]
